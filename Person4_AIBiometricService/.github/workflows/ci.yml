name: ci

on:
  push:
    branches: [main, master, "person4/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # A dependency that was clean on Monday is not clean on Friday. The
    # supply-chain gate below runs on every push, but a repository nobody has
    # pushed to for a week is exactly the one with an unnoticed advisory.
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder secrets. The service refuses to start without them, so CI needs
  # values; these are all-zero and never touch a real deployment.
  PNSM_APP_ENV: test
  PNSM_LOG_LEVEL: WARNING
  PNSM_KEY_PROVIDER: static
  PNSM_FLE_KEYS: '{"k1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=","k2":"AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI="}'
  PNSM_FLE_ACTIVE_KEY: k1
  PNSM_PIN_PEPPER: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
  PNSM_HMAC_SECRET: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
  PNSM_ADMIN_TOKEN: ci-admin-token
  PNSM_AWS_REGION: ap-southeast-1
  PNSM_BCRYPT_COST: "4"
  PNSM_ALLOW_STUB_MODELS: "true"
  PNSM_MODEL_VERSION: stub_v1
  PNSM_MIN_BLUR_VAR: "10.0"
  PNSM_ENROL_MIN_BLUR_VAR: "10.0"

jobs:
  quality:
    name: lint, types, dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Dependency blocklist
        # The gate that stops `pip install deepface` reaching a deployment and
        # taking the container down with it.
        run: python scripts/check_deps.py

      - name: Lint
        run: ruff check app tests scripts calibration clients/python

      - name: Types
        run: mypy

  supply-chain:
    name: supply chain (OWASP A03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Audit dependencies
        # Exits 1 on a high or critical finding and 2 if the audit could not
        # run at all. Both fail the job -- "we found nothing because we could
        # not look" is not a passing audit.
        #
        # The master plan names `npm audit`; the same script covers the Node
        # side when the frontend checkouts are present. Person 1, 2 and 3 call
        # it from their own workflows with --npm .
        run: python scripts/audit_deps.py --severity high

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Unit, security, deploy, contract and API tests
        run: pytest --ignore=tests/memory -q

      - name: Memory gate
        # Runs alone so another test's allocations cannot be attributed to it.
        run: pytest tests/memory -q

      - name: Offline runner still works
        # Proves the dependency-light path stays usable: it is what verifies
        # the core on a machine where the full toolchain is not installed.
        run: python scripts/verify_offline.py

      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check

  manifests:
    name: deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every placeholder resolves and every document is valid JSON
        # A placeholder left unfilled is accepted by the AWS API and creates a
        # resource literally named "<REGION>". This is the only place that is
        # caught before the account sees it.
        run: |
          python scripts/provision_aws.py \
            --account-id 000000000000 \
            --github-org pnsm-group8 \
            --github-repo pnsm \
            --check

      - name: IAM policies parse as policies, not just as JSON
        # A second opinion from AWS's own parser, free and offline.
        run: |
          python scripts/provision_aws.py --account-id 000000000000 \
            --github-org pnsm-group8 --github-repo pnsm --render
          for f in deploy/rendered/iam/*.json; do
            echo "checking $f"
            python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('Version')=='2012-10-17', 'missing policy version'; assert d.get('Statement'), 'no statements'" "$f"
          done

  frontend-image:
    name: frontend container (under 50 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble a build context
        # deploy/frontend.Dockerfile builds Person 1's and Person 2's source,
        # which lives in other repositories. tests/fixtures/frontend-smoke is a
        # zero-dependency stand-in shaped like a Vite project, so the Dockerfile
        # itself -- the multi-stage split, npm ci, the nginx config, the size --
        # is verified here rather than discovered at integration.
        run: |
          mkdir -p ctx
          cp -r tests/fixtures/frontend-smoke/. ctx/
          mkdir -p ctx/deploy
          cp deploy/frontend.Dockerfile deploy/nginx.conf.template ctx/deploy/

      - name: Build
        run: |
          docker build -f ctx/deploy/frontend.Dockerfile \
            --build-arg APP_NAME=pnsm-frontend-ci \
            --build-arg PNSM_API_ORIGIN=https://api.example.invalid \
            --build-arg PNSM_S3_ORIGIN=https://selfies.example.invalid \
            -t pnsm-frontend:ci ctx

      - name: Size gate
        run: |
          BYTES=$(docker image inspect pnsm-frontend:ci --format '{{.Size}}')
          MB=$((BYTES / 1048576))
          echo "frontend image: ${MB} MB"
          if [ "$MB" -gt 50 ]; then
            echo "::error::Frontend image is ${MB} MB. The master plan requires under 50 MB."
            echo "::error::Something from the builder stage is reaching the runtime image --"
            echo "::error::check for a COPY that brings node_modules or the Node runtime across."
            exit 1
          fi

      - name: The SPA fallback actually serves index.html for a deep link
        # The single most consequential line in the nginx config. A deep link
        # returning 404 breaks every bookmark and every browser refresh, and it
        # is invisible until somebody tries one.
        run: |
          docker run -d --name fe -p 8080:8080 pnsm-frontend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          echo "--- deep link"
          CODE=$(curl -s -o /tmp/deep.html -w '%{http_code}' http://localhost:8080/dashboard/geofences)
          test "$CODE" = "200" || { echo "::error::deep link returned $CODE, expected 200"; docker logs fe; exit 1; }
          grep -q '<div id="root">' /tmp/deep.html || { echo "::error::deep link did not serve the SPA shell"; exit 1; }
          echo "--- security headers"
          curl -sI http://localhost:8080/ | tee /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt || { echo "::error::no CSP"; exit 1; }
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt || { echo "::error::no X-Frame-Options"; exit 1; }
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt || { echo "::error::no nosniff"; exit 1; }
          echo "--- the CSP carries the injected origins, not the placeholders"
          grep -q 'api.example.invalid' /tmp/headers.txt || { echo "::error::envsubst did not run"; exit 1; }
          grep -q 'PNSM_API_ORIGIN' /tmp/headers.txt && { echo "::error::placeholder survived into the header"; exit 1; }
          echo "--- it does not run as root"
          test "$(docker exec fe id -u)" != "0" || { echo "::error::nginx is running as root"; exit 1; }
          docker stop fe

  image:
    name: ai service container
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder weights
        # The image bakes weights in; CI does not need the real ones to prove
        # the Dockerfile builds and the layers are the expected size.
        run: |
          mkdir -p models
          head -c 13600000 /dev/urandom > models/w600k_mbf.onnx
          head -c 232589   /dev/urandom > models/face_detection_yunet_2023mar.onnx

      - name: Build
        run: docker build -t pnsm-ai-svc:ci .

      - name: Image size gate
        run: |
          BYTES=$(docker image inspect pnsm-ai-svc:ci --format '{{.Size}}')
          MB=$((BYTES / 1048576))
          echo "image size: ${MB} MB"
          if [ "$MB" -gt 700 ]; then
            echo "::error::Image is ${MB} MB. Target is under 450 MB; over 700 MB means"
            echo "::error::something heavy was added. Check requirements.txt."
            exit 1
          fi

      - name: Container starts and serves /health inside the Fargate memory limit
        # 1024 MB is what deploy/ecs-task-definition.json requests. Testing
        # against the real limit is the point: a container that only starts
        # with more memory than it will be given has not been tested.
        run: |
          docker run -d --name pnsm-ci -m 1024m -p 8000:8000 \
            -e PNSM_FLE_KEYS='${{ env.PNSM_FLE_KEYS }}' \
            -e PNSM_PIN_PEPPER='${{ env.PNSM_PIN_PEPPER }}' \
            -e PNSM_HMAC_SECRET='${{ env.PNSM_HMAC_SECRET }}' \
            -e PNSM_ADMIN_TOKEN='${{ env.PNSM_ADMIN_TOKEN }}' \
            -e PNSM_ALLOW_STUB_MODELS=true \
            -e PNSM_MODEL_VERSION=stub_v1 \
            -e PNSM_APP_ENV=test \
            pnsm-ai-svc:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -s http://localhost:8000/ready | head -c 800
              echo
              echo "--- security headers on an unauthenticated response"
              curl -sI http://localhost:8000/health | grep -iE '^(content-security-policy|x-frame-options|x-content-type-options|referrer-policy):' \
                || { echo "::error::the API is not emitting its A02 headers"; exit 1; }
              docker stop pnsm-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container never became healthy inside the Fargate memory limit."
          docker logs pnsm-ci
          exit 1
