server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Non-root nginx cannot bind :80, hence 8080. ECS maps it.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # SPA deep-link fallback — the nginx form of the CloudFront custom error
  # response. Without it, refreshing /employees/onboarding returns a hard 404,
  # because no such file exists: the whole app is one index.html.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change on every build, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The shell must NEVER be cached, or users keep booting a stale bundle that
  # references asset hashes which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
