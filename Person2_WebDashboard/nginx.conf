server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Non-root nginx cannot bind :80, hence 8080. ECS maps it.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # Security headers (OWASP A02). THESE MUST BE REPEATED IN EVERY LOCATION
  # BLOCK BELOW THAT DEFINES ITS OWN add_header, not just declared once here.
  #
  # nginx's add_header inheritance rule: a location block inherits add_header
  # directives from its parent ONLY if that location has no add_header of its
  # own -- the moment a location adds even one header, it silently stops
  # inheriting ALL of them, server-level ones included. Every location below
  # that sets Cache-Control (or anything else) breaks inheritance from here.
  #
  # Confirmed live (Person2 standalone Docker verification pass): the first
  # version of this file declared these three headers exactly once, right
  # here, assuming they would apply everywhere -- they didn't. `try_files`'s
  # fallback to /index.html is an internal redirect that gets re-matched
  # against location blocks, landing in `location = /index.html` below, which
  # already had its own Cache-Control add_header and therefore silently
  # dropped these three on literally every real page load. `location = /healthz`
  # had the same problem. curl -I confirmed both were missing X-Frame-Options
  # et al. entirely before this fix.
  # ---------------------------------------------------------------------------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---------------------------------------------------------------------------
  # SPA deep-link fallback — the nginx form of the CloudFront custom error
  # response. Without it, refreshing /employees/onboarding returns a hard 404,
  # because no such file exists: the whole app is one index.html.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change on every build, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # The shell must NEVER be cached, or users keep booting a stale bundle that
  # references asset hashes which no longer exist. This is the block every
  # normal page load actually resolves through via the try_files fallback
  # above, so it MUST repeat the security headers itself (see the comment
  # block at the top of this file).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
