# Additive local TLS/PQC reverse proxy (Item 8, Flawless/Ultra blueprint).
#
# A SEPARATE, OPTIONAL layer in front of the existing plain-HTTP backend —
# not a migration. The day-to-day dev workflow (mobile/web dev servers
# pointed at http://localhost:5000) is completely untouched; this container
# just proves the real, checkable claim both blueprints make about TLS 1.3
# edge termination and post-quantum hybrid key exchange, on :8443.
#
# nginx:alpine ships OpenSSL 3.5+ (confirmed via `nginx -V` before writing
# this file — 3.5 is the first OpenSSL release with native ML-KEM support),
# so X25519MLKEM768 needs no custom build, no patches, nothing exotic.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Required for the location block's WebSocket upgrade below — nginx keys
  # the Connection header off the incoming Upgrade header per RFC 7230; an
  # empty Upgrade means "keep-alive", any other value means "upgrade".
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/tls-proxy.crt;
    ssl_certificate_key /etc/nginx/certs/tls-proxy.key;

    # TLS 1.3 only: the hybrid PQC group and the 36%-handshake-latency claim
    # both blueprints make are TLS 1.3-specific properties. Group order
    # matters — first is what a supporting client negotiates.
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_prefer_server_ciphers off;

    location / {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # $remote_addr ONLY, not $proxy_add_x_forwarded_for — this proxy is the
      # genuine network edge (nothing trusted sits in front of it), so
      # appending to whatever X-Forwarded-For a client already sent would let
      # that client prepend an arbitrary spoofed IP of their own choosing.
      # Backend's `trust proxy` setting (app.ts) trusts this hop and reads
      # the header verbatim, so this proxy must be the one place in the
      # chain that guarantees the header can only ever hold nginx's own
      # genuinely observed $remote_addr, discarding anything the client sent
      # — confirmed live: sending a client-supplied `X-Forwarded-For:
      # 6.6.6.6` through the un-fixed config let it straight through and
      # became the rate limiter's/incident blocklist's own idea of the
      # client IP, defeating both.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;

      # Socket.IO's real-time attendance/spoof-alert feed (Person 2's live
      # dashboard) needs the WebSocket handshake forwarded through, or it
      # silently degrades to long-polling (or fails, depending on client
      # transport config) the moment anything is pointed at :8443 instead of
      # :5000 directly.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
