# ============================================================================
# SUPERSEDED — not the compose file this project actually uses.
# ============================================================================
# Leftover from this quadrant's own early, single-quadrant development phase
# (Phase 1/2), before the root-level docker-compose.yml unified all four
# quadrants (Phase 5) and, later, added Redis, the TLS/PQC proxy, and real
# MongoDB Atlas (DECISIONS.md N24, N30, N40). Nothing in this project
# references or runs this file any more — confirmed via a repo-wide search
# before writing this note, not assumed. Its `MONGODB_URI` still points at
# the local `mongo:27017` container shape this backend no longer uses in the
# real dev workflow (see the root docker-compose.yml + SETUP.md instead).
# Left in place rather than deleted (it costs nothing sitting unused, and
# deleting files unasked is a bigger call than documenting one honestly), but
# do not `docker compose up` from inside this directory expecting it to match
# the real stack — it won't.

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/pnsm
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me
      ADMIN_ALLOWED_ORIGINS: http://localhost:3000
      FACE_SERVICE_PROVIDER: mock
      # Person 4's AI service (DECISIONS.md N1/N2/N7) — local dev-complete runs
      # it alongside this backend via its own docker-compose; PNSM_AI_URL here
      # assumes the two compose projects share a network (see ROADMAP.md Phase 5).
      PNSM_AI_URL: http://ai-service:8000
      PNSM_HMAC_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # S3-compatible local object store, standing in for R2/AWS S3 (DECISIONS.md
  # B3/B4/N7). Person 4's AI service is the only thing that talks to this
  # directly (it owns presigning) — this backend never touches bucket
  # credentials itself, per DECISIONS.md N2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pnsm-dev
      MINIO_ROOT_PASSWORD: pnsm-dev-secret
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
